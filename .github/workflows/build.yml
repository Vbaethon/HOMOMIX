name: Generate HOMOMIX.json

on:
  push:
    branches: [main]
    paths: ['Icon/**', 'generate_readme.py', 'HOMOMIX.json', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: homomix-generated-files
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use latest main before generation
        if: github.event_name != 'pull_request'
        run: git pull --ff-only origin main
      - name: Generate current public file
        run: python generate_readme.py --catalog
      - name: Check pull request output
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- HOMOMIX.json
      - name: Commit only if changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- HOMOMIX.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HOMOMIX.json
          git commit -m "Update HOMOMIX.json"
          git push origin HEAD:main
