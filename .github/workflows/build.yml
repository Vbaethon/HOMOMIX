name: Generate HOMOMIX.json

on:
  push:
    branches:
      - main
    paths:
      - "Icon/Color/**"
      - "generate_catalog.py"
      - "tests/test_catalog.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run script
        run: python3 generate_catalog.py

      - name: Validate catalog
        run: python3 -m unittest discover -s tests -p 'test_catalog.py' -v

      - name: Push to main branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add HOMOMIX.json
          if git diff --cached --quiet; then
            echo "HOMOMIX.json is already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Update icon catalog"
          git push origin HEAD:main
