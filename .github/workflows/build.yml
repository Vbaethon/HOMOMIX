name: Validate icon library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# All repository changes trigger validation: source plans, aliases, dependency
# locks, tests, metadata and generators must not silently bypass the full gate.
permissions:
  contents: read
concurrency:
  group: icon-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        shell: bash
        run: |
          SOURCE=$(python -c 'import json; print(json.load(open("build-config.json"))["source_dir"])')
          RENDERER=$(python -c 'import json; print(json.load(open("build-config.json"))["renderer_dir"])')
          python -m pip install -r "$SOURCE/requirements.txt"
          npm ci --prefix "$RENDERER" --ignore-scripts
      - name: Full tests and deterministic cold image build
        run: python scripts/validate_icons.py --tests --cold --jobs 2
