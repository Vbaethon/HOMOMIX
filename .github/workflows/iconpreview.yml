name: Update paired README icon gallery

on:
  push:
    branches: [main]
    paths: ['Icon/**', 'generate_readme.py', 'README.md', '.github/workflows/iconpreview.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: homomix-generated-files
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use latest main before generation
        if: github.event_name != 'pull_request'
        run: git pull --ff-only origin main
      - name: Install image measurement dependency
        run: python -m pip install Pillow==11.3.0
      - name: Generate paired Large and FDS gallery
        run: python generate_readme.py
      - name: Check pull request output
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md
      - name: Commit only if changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update paired README icon gallery"
          git push origin HEAD:main
